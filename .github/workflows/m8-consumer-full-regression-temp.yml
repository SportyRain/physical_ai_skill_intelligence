name: m8-consumer-full-regression-temp

on:
  push:
    branches:
      - m8-consumer-runtime-contract-propagation

jobs:
  software-only-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile package
        env:
          PYTHONPATH: src
        run: python -m compileall -q src
      - name: Run full software test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q
